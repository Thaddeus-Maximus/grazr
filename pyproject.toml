[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grazr"
version = "0.1.0"
description = "Recordkeeping for a grazing operation, in Markdown files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "ruamel.yaml>=0.18",
  "python-dateutil>=2.8",
  "shapely>=2.0",
  "pyproj>=3.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grazr = "grazr.cli:main"

[tool.setuptools.packages.find]
include = ["grazr*"]

[tool.setuptools.package-data]
grazr = ["templates/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
